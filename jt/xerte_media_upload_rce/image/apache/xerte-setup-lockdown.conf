# Deployment hardening, not an application change: after installation only the
# installer's status page stays reachable. The wizard pages accept unauthenticated
# POSTs that rewrite site configuration and reload the schema, which no installed
# site should serve. See _maintainer/README.md.
<Directory /srv/challenge/xerte/setup>
    Require all denied
    <Files "index.php">
        Require all granted
    </Files>
</Directory>
