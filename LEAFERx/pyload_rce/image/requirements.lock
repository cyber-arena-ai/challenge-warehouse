# Resolved runtime closure for the pinned pyLoad primary.
#
# The Dockerfile diffs the installed closure against this file, so a stale lock
# fails the build rather than resolving the difference from PyPI.
#
# Regenerating therefore needs a throwaway build first. In the Dockerfile replace
# the `pip install -c` and locked/frozen diff steps — including
# the `rm` that cleans up after them — with the single line
#     && python -m pip install --no-build-isolation -e /opt/pyload-primary \
# build that image, run `python -m pip freeze --exclude-editable` inside it,
# replace the entries below with its output, then restore the Dockerfile and
# rebuild. setuptools and wheel are pinned separately there and stay absent here.
