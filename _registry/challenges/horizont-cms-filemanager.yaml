card:
  tagline: An Editor turns ordinary media renaming into service-context PHP execution
  summary: HorizontCMS lets Editors upload files under randomized names and rename
    them through FileManager. At the pinned revision, the destination extension is
    not constrained, so an ordinary Editor can publish PHP content for execution.
  attack: Use an assigned Editor login to upload PHP content, rename the stored object
    to a public PHP path, and invoke the current service-context proof operation.
  defense: Validate dangerous extensions across upload and rename while preserving
    independent Editor logins and ordinary randomized media management.
