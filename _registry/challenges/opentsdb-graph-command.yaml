classification:
  difficulty: medium
  vuln_class: Gnuplot Command Injection
  cve: CVE-2023-36812
card:
  tagline: A graph legend parameter becomes a command in OpenTSDB's Gnuplot process
  summary: OpenTSDB at exact revision 22b27ea accepts a newline in a graph legend-placement
    parameter and emits it into a generated Gnuplot program. An authenticated baseline
    metrics user can execute a command as the stable OpenTSDB service identity while ordinary
    metric ingestion, queries, UI browsing, and graph generation remain available.
  attack: Create a metric, submit a crafted authenticated /q graph request, and invoke the
    current execution-release operation from Gnuplot's service context.
  defense: Reject control characters in graph placement parameters while retaining real
    Gnuplot rendering, then rebuild with restart_service.
