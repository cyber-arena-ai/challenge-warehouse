  vuln_class: Signed URL Authentication Bypass
  cve: CVE-2023-49105
card:
  tagline: Uninitialized signing keys turn public links into cross-user file access
  summary: ownCloud accepts a pre-signed WebDAV URL for an ordinary user whose signing
    key was never initialized. A forged public request can read or overwrite that user's
    protected current-round file while ordinary cross-user WebDAV remains denied.
  attack: Forge a current signed WebDAV GET or PUT for the published victim file.
  defense: Reject signed requests when the credential user's signing key is uninitialized.
