  source_intro: >-
    ownCloud 10.13.1 RC1 at upstream commit ac4f3383952837bc6d260408d2db6d107a47c42c.
    The service exposes ordinary authenticated file storage and public pre-signed WebDAV links.
    Each attacker receives a distinct ordinary account; current protected victim file locators
    rotate by round. Defenders edit /srv/challenge/owncloud and reload with restart_service.
