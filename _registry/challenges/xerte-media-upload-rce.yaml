card:
  tagline: An installer leak plus a connector that redirects but never stops ends in a web-root
    shell
  summary: Xerte Online Toolkits at commit 4e40f803 leaves the elFinder media connector reachable
    without a session — it emits a redirect and keeps running with caller-supplied upload
    paths. A disguised upload, an incomplete extension pattern and a traversal-bearing rename
    put an executable file in the Apache-writable web root, and the only proof of the objective
    is a helper that answers solely in the service execution context.
  attack: Create an ordinary project with your assigned account, read the application root
    from the installer status page, drive the unauthenticated connector against that project's
    media directory, and run the round's helper operation from the resulting web-root file.
  defense: Terminate the unauthorized connector request, reject traversal-bearing names, complete
    the extension pattern, and stop the installer page from printing the root path — without
    breaking ordinary project media upload.
