  accent: '#d95b45'
  prompt_id: geo-v2
  motif: A dashboard grid and media-file stack share one framed service boundary; a narrow
    session ribbon slips across the frame and bends through an obsolete import slot, where
    one media tile becomes an executable block. A separate rotating target marker hangs
    beyond the grid, reached only by the command path, while a clean parallel upload lane
    remains intact for ordinary User traffic.
