  source_intro: Navigate CMS 2.8 r1302 is a PHP/MySQL content-management system. Attackers
    receive a distinct normal User account for dashboard and media workflows. Defenders
    may edit the application under /srv/challenge/navigate and reload it with restart_service
    while preserving login and ordinary upload.
