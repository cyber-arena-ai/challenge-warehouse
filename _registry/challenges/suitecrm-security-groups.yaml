card:
  tagline: An ordinary CRM user crosses a native Security Group record boundary
  summary: SuiteCRM serves Cases, Notes, Reports, OAuth, and REST V8 under
    native Security Group partitions. Each attacker receives an equivalent
    ordinary account in its own partition while a protected Note belongs to another.
  attack: Use a public SuiteCRM path to recover the current protected Note filename;
    the target UUID rotates with each flag.
  defense: Preserve ordinary record, report, OAuth, and relationship workflows while
    enforcing Security Group authorization at every relevant source and related record.
