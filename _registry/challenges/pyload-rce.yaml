  tagline: Bypass the localhost guard and escape js2py to run subprocess.Popen on pyLoad
  summary: 'pyLoad 0.5.0b3.dev79''s /flash/addcrypted2 endpoint evaluates the attacker-supplied
    `jk` parameter as JavaScript via js2py, whose sandbox can be escaped to reach subprocess.Popen.
