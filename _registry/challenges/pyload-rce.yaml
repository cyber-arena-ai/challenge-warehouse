    yielding unauthenticated arbitrary command execution.'
  attack: 'POST /flash/addcrypted2 with Host: 127.0.0.1:9666 and a js2py-escape `jk` payload
    that reads /opt/secret/flag.txt and exfiltrates it.'
  defense: Edit /srv/challenge/pyload/.../cnl_blueprint.py to stop evaluating `jk` (or harden
    eval_js), then restart_service.
