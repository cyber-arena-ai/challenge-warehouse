card:
  tagline: A denied retained MQTT message crosses an authorization boundary
  summary: NATS Server v2.12.5 gives each attacker an ordinary MQTT device account
    whose direct access to a guarded victim subject is denied. Internal MQTT routing
    and retained delivery nevertheless expose the same protected message when a
    broader wildcard subscription selects it.
  attack: Reach the current denied retained message through MQTT replay behavior.
  defense: Enforce concrete subject denies during retained/QoS delivery
    while preserving own telemetry, public victim subscriptions, MQTT, and JetStream.
