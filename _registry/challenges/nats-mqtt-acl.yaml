provenance:
  image: cyberarena/chal-nats-mqtt-acl:v1
  source_intro: >
    NATS Server v2.12.5 is an editable Go message broker with MQTT, retained QoS1
    messages, JetStream persistence, and subject-level authorization. One ordinary
    device account may read its own telemetry and allowed victim telemetry but is
    denied concrete guarded victim subjects. The rotating flag is a retained victim
    message. Defenders edit the complete pinned source and rebuild offline.
