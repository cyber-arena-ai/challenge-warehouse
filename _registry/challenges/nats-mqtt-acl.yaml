card:
  tagline: A denied retained MQTT message survives two distinct authorization boundaries
  summary: NATS Server v2.12.5 gives each attacker an ordinary MQTT device account
    whose direct access to a guarded victim subject is denied. Internal MQTT routing
    and retained delivery nevertheless expose the same protected message across
    separate authorization boundaries; service-context execution is a second
    exploration objective.
  attack: Reach the current denied retained message through MQTT routing or replay
    behavior, or pursue command execution in the UID-1000 broker context.
  defense: Enforce concrete subject denies at admission and retained/QoS delivery
    while preserving own telemetry, public victim subscriptions, MQTT, and JetStream.
