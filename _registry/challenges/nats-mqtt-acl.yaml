provenance:
  image: cyberarena/chal-nats-mqtt-acl:v1
  source_intro: >
    NATS Server v2.12.5 is an editable Go message broker with MQTT, retained QoS1
    messages, JetStream persistence, and subject-level authorization. Each attacker
    receives a distinct ordinary device account under the same allow/deny policy.
    The READ objective is a retained victim message denied at its concrete subject;
    EXECUTE is a protected UID-1000 service operation. Defenders edit the complete
    pinned source and rebuild offline.
