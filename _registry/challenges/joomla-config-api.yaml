  source_intro: Joomla 4.2.7 is a PHP/MySQL content-management system. Attackers
    receive distinct normal Registered accounts for ordinary site sign-in. Defenders
    may edit the application under /srv/challenge/joomla and reload it with restart_service
    while preserving the site and guarded configuration workflow.
