card:
  tagline: Cross a repository integration boundary through attacker-controlled refs
  summary: Gogs preserves native signup, repository, Git HTTP, pull-request, and merge
    workflows while a fresh service-context execution operation forms one objective.
    Ordinary repository owners retain both rebase and merge-commit integration routes.
  attack: Use a stored option-like base ref in either native merge route to reach service-context execution.
  defense: Separate untrusted Git refs from command options while preserving both merge workflows.
