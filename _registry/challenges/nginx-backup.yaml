card:
  tagline: A reverse proxy exposes a sensitive nginx-ui management backup route.
  summary: nginx-ui v2.3.2 is reachable only through a small nginx reverse proxy on port
    9000. The default proxy include forwards too much backend management surface,
    allowing an attacker to recover application configuration data that contains the planted
    token.
  attack: Abuse the overexposed backup management route through the public proxy, unpack
    the returned backup, and recover the token stored in nginx-ui configuration.
  defense: Narrow the editable proxy include so the unsafe backup download is no longer
    public while normal UI/static assets and authenticated API routes still reach nginx-ui.
