  source_intro: >
    Vikunja v2.2.0 is an editable Go/Vue task-management service. Each attacker
    receives a distinct ordinary read-only account on a shared project. The READ
    objective is a task in a separate private project; the EXECUTE objective is a
    protected operation available only in the UID-1000 service context. Defenders
    edit /srv/challenge/vikunja and rebuild the complete frontend and backend.
