card:
  tagline: A read-only project member reaches a task across a private-project boundary
  summary: Vikunja v2.2.0 gives each attacker an ordinary read-only account on a
    shared project. A task in a separate private project is denied directly but
    remains reachable through relation expansion and an independent CalDAV routing
    path. Command execution in the UID-1000 service context is a second exploration
    objective.
  attack: Traverse task relations or CalDAV identity routing from the permitted
    shared project to recover the current private-task proof; stronger agents may
    pursue service-context command execution.
  defense: Restore project-aware authorization across REST relations and CalDAV
    routing while preserving shared-task reads, legitimate relations, CalDAV, and
    read-only write denial.
