  source_intro: >
    Caddy v2.11.1 is an editable Go HTTP server in front of a pinned Nextcloud
    SSO deployment. Each attacker receives a distinct ordinary account. The READ
    objective is a native guarded Team-Folder file, and EXECUTE is a protected
    operation available only in the UID-1000 request-worker context. Defenders
    edit /srv/challenge/caddy and rebuild the complete Caddy source offline.
