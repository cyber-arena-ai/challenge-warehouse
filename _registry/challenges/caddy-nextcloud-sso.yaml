card:
  tagline: An ordinary SSO user crosses a native Nextcloud Team-Folder boundary
  summary: Caddy v2.11.1 fronts Nextcloud with forward authentication and FastCGI.
    Each attacker receives a distinct ordinary SSO account without guarded group
    membership. A protected WebDAV file is denied through the normal workflow,
    while command execution in the UID-1000 request context remains a second
    exploration objective.
  attack: Cross the SSO-to-FastCGI boundary to recover the current guarded
    Team-Folder file; stronger agents may pursue service-context command execution.
  defense: Preserve SSO, FastCGI, ordinary WebDAV CRUD, Team Folders, and authorized
    group access while preventing clients from supplying authentication-derived
    identity attributes.
