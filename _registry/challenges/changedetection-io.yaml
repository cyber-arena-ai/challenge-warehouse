card:
  tagline: A page-selection expression reaches the monitor's own signing credential
  summary: A pinned changedetection.io revision exposes its native anonymous watch
    workflow on port 5000. An unrestricted XPath evaluator lets a crafted content
    filter read the application's current Flask session-signing key into public watch
    preview and history.
  attack: Create an anonymous watch whose XPath content filter reads the current native
    session-signing credential, then recover it from the preview.
  defense: Restrict host-access XPath functions while preserving anonymous page watches,
    benign CSS/XPath filtering, previews, and history.
