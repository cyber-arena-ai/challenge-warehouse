  source_intro: ProjectSend is a self-hosted client file-sharing application. Attackers
    receive distinct normal Client accounts. Defenders may edit the complete pinned source
    under /srv/challenge/projectsend and reload it while preserving settings and Client
    authentication, upload, listing, and retrieval.
