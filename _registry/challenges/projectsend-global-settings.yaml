card:
  tagline: A public request crosses ProjectSend's administrator-only settings boundary
  summary: ProjectSend provides authenticated Client file sharing while reserving global
    site settings for administrators. A historical request path permits an unauthenticated
    caller to persist a protected configuration value.
  attack: Cross the settings authorization boundary and persist the current verification
    mark as ProjectSend's public site title.
  defense: Harden settings authorization under /srv/challenge/projectsend, then restart
    the service while preserving administrator settings and normal Client file sharing.
