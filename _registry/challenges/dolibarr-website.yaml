card:
  tagline: A restricted Website editor crosses into server-side command execution
  summary: Dolibarr 16.0.5 exposes its normal ERP/CRM and Website workflows to distinct
    non-administrator editors while reserving dynamic server code for a separate permission.
  attack: Cross the Website source-filter boundary and recover the rotating service-command
    witness through the public page renderer.
  defense: Harden Website source handling under /srv/challenge/dolibarr, then restart the
    service while preserving restricted-editor publication and public rendering.
