provenance:
  image: cyberarena/chal-dolibarr-website:v1
  source_intro: Dolibarr is an ERP/CRM application with an enabled Website module. Attackers
    receive distinct restricted Website editor accounts. Defenders may edit the complete
    pinned source under /srv/challenge/dolibarr and reload it with restart_service while
    preserving ordinary Website publication and public rendering.
cover:
