  accent: '#c77a35'
  prompt_id: geo-v2
  motif: A structured ERP dashboard grid feeds a framed Website canvas through a narrow
    editor lane. One mixed-case code ribbon slips through a filter seam and reaches a
    separate service-command block beyond the publication boundary, while a parallel
    clean HTML lane remains intact and ends in a public page frame.
