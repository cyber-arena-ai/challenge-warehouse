card:
  tagline: Turn a pull-request base ref into a server-side Git rebase command
  summary: Gogs is a self-hosted Git service with ordinary repository, branch, and pull-request workflows. An option-like base ref reaches Git rebase without an end-of-options marker during rebase merge, allowing an ordinary repository owner to run a command as the service process.
  attack: Create a fresh repository and malicious base ref, open the first pull request, and invoke rebase merge to execute a command.
  defense: Preserve normal Git HTTP and pull-request rebase workflows while separating attacker-controlled ref names from Git options.
