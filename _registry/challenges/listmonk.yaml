card:
  tagline: Turn a protected credential leak into authenticated private-object access
  summary: A restricted listmonk subscriber-data analyst may run SQL expressions over
    subscriber data and export the filtered result as CSV. At the pinned vulnerable commit,
    the export path omits the relation validation used by ordinary queries, allowing the
    analyst to reflect an administrator-only settings credential in a database error.
    That credential authenticates to a private S3-compatible campaign archive holding
    a second independently scored flag.
  attack: Use a cast-error expression on the subscriber export route to reflect the protected
    S3 secret from the settings table, then use it to read the private archive object.
  defense: Apply relation validation to export expressions and close the parameter-dependent
    ordinary-query validation bypass while preserving legitimate filtered queries and CSV
    export. The former is the arena's narrow export-only hardening; the complete upstream
    c0a6525 fix covers both genuine vulnerability paths.
