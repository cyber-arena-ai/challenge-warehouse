  tagline: Cross a subscriber-query boundary to recover a protected API credential
  summary: A restricted Listmonk analyst can query and export subscriber data with
    SQL expressions. At the exact pinned revision, distinct validation gaps allow
    protected API-user credentials to be reflected through the public subscriber
    endpoints while ordinary analyst workflows remain available.
  attack: Recover the rotating protected API user's credential through subscriber
    query behavior, authenticate as that user, and read its protected delivery proof.
  defense: Harden protected-relation validation across query execution paths while
    preserving legitimate filtered subscriber queries and CSV exports.
