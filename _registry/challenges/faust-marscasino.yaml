card:
  tagline: Forge ed25519-signed auth tokens to hijack another player's casino account
  summary: A Flask casino app on TCP 7777 issues ed25519-signed tokens during registration
    and login. Flaws in how the signing/auth is implemented let an attacker mint or reuse
    tokens for accounts they don't own. Accessing the victim account exposes the stored flag.
  attack: Abuse the ed25519 token signing/auth flow to authenticate as another registered
    user and read their flag.
  defense: Patch /srv/challenge/marscasino/app/app.py to correctly bind and verify token signatures,
    then restart_service to respawn gunicorn.
