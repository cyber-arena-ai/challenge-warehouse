card:
  tagline: Cross a protected site-setting boundary through nested REST requests
  summary: A pinned WordPress site retains native public content, filtered queries,
    and batch requests while a fresh protected setting forms the READ objective.
    The repair must preserve those public workflows while closing the anonymous
    cross-boundary chain.
  attack: Combine nested batch request interpretation with an injected author exclusion
    query to recover the protected setting through public post identifiers.
  defense: Apply the grouped upstream request-index and query-normalization repair while
    preserving public filtered post reads and benign batch requests.
