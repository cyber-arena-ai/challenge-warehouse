  cve: CVE-2022-0824
card:
  tagline: A preference-only Webmin user crosses a module ACL into root command execution
  summary: Webmin gives each user an explicit module set. At the pinned core and Authentic
    Theme revisions, a user limited to personal preferences can still operate the theme's
    File Manager against the root-running service tree.
  attack: Use an assigned restricted login and application workflows to make the current
    root service release the rotating command-execution objective.
  defense: Enforce Webmin's native module security check in the theme File Manager while
    preserving restricted preferences and the administrator's dynamic file operations.
