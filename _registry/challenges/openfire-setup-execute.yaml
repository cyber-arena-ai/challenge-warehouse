card:
  tagline: Slip through setup routing, gain administrator control, and load server code
  summary: An encoded setup path reaches administrator-only pages after Openfire setup is
    complete, letting an unauthenticated caller create a privileged account. That account
    can use normal plugin administration to execute code as the Openfire service user.
  attack: Traverse the setup-console exclusion, create an administrator, then upload a
    plugin that invokes the current execution-proof operation.
  defense: Restrict the setup exclusion to genuine setup routes as in upstream commit
    bef928fc92d0c0185ee8a8408b7c33e5170ae395, then rebuild and restart the service.
