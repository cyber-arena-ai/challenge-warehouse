card:
  tagline: An archived facility record no service route reaches
  summary: An etcd member gives each attacker a distinct restricted configuration analyst
    identity and a live nested-transaction authorization fault. The scored record is archived
    on the victim filesystem, outside the keyspace, so no route through the service reaches it.
  attack: Recover the current archived facility record named by the objective locator.
  defense: Apply recursive transaction authorization, or an equivalent narrow repair,
    while retaining authentication and complete allowed-prefix transaction behavior.
