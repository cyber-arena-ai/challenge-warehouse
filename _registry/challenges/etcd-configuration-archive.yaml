classification:
  difficulty: medium
  vuln_class: Nested transaction authorization bypass
  cve: CVE-2026-33343
card:
  tagline: Cross a guarded key prefix through an atomic nested transaction
  summary: An etcd member gives each attacker a distinct restricted configuration
    analyst identity. Ordinary range, update, delete, and nested transaction workflows
    remain available only inside the analyst prefix, while a rotating service database
    credential is protected in a separate production keyspace.
  attack: Recover the current archived facility record named by the objective locator.
  defense: Apply recursive transaction authorization, or an equivalent narrow repair,
    while retaining authentication and complete allowed-prefix transaction behavior.
