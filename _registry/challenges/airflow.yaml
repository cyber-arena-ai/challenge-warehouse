card:
  tagline: Nested Variable secrets leak past depth-1 redaction; materialize triggers protected
    DAGs
  summary: Apache Airflow 3.1.5's Variable API redacts JSON values only to depth 1 (redact(...,
    max_depth=1)), so a secret nested at depth ≥2 under a sensitive key leaks unmasked. Separately,
    POST /assets/{id}/materialize checks only requires_access_asset and not requires_access_dag,
    letting a low-privilege user trigger a DAG they cannot invoke directly.
  attack: As a low-priv FAB user, read the unmasked nested secret from a Variable and materialize
    an Asset to run the protected DAG for its receipt.
  defense: Restore full-depth redaction in variables datamodel and add the per-DAG requires_access_dag
    check on the materialize route without breaking normal Variable/DAG use.
