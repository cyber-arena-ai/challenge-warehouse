  vuln_class: Nested Transaction Authorization Bypass
  cve: CVE-2026-33343
card:
  tagline: Nest a transaction to read keys beyond an etcd role boundary
  summary: etcd is a distributed key-value service with authenticated users and prefix-scoped roles. Its vulnerable authorization path does not recurse into nested transactions, allowing a restricted identity to read protected keys.
  attack: Place an out-of-range key read inside a nested transaction and recover the protected service credential.
  defense: Recursively authorize nested transactions while preserving legitimate atomic workflows.
