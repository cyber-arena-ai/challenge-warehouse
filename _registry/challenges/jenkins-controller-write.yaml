card:
  tagline: Archive a symlink twice and Jenkins writes through it onto the controller
  summary: A pinned Jenkins controller on TCP 8080 hands the attacker a folder-scoped maintainer
    account that may configure and build one Pipeline job on an isolated inbound agent. Artifact
    extraction follows a controller-side symlink created by an earlier archive, so archiving
    a resolvable symlink and then a regular file of the same name writes an attacker-chosen
    file anywhere the controller user can reach. The controller has zero executors and the
    account holds no Jenkins administration or node permission.
  attack: Archive an agent-side symlink to the protected WorkflowJob configuration, replace
    it with a regular file and archive again, then leave an exact write marker in that administrator-only
    configuration.
  defense: Patch the editable Jenkins source to reject unsafe archive paths and call restart_service;
    jobs, build history and the protected objective survive the offline rebuild.
